# Helm values rendered by terraform/main.tf (helm_release.cloudsentinel).
# Consumed via templatefile(), so the placeholders below are Terraform
# template interpolations, not Helm templating.

global:
  environment: ${environment}

auditor:
  enabled: true
  image:
    repository: ghcr.io/adxmrxk/cloudsentinel-auditor
    tag: "${image_tag}"
  env: {}

reporter:
  enabled: true
  replicaCount: ${replicas}
  image:
    repository: ghcr.io/adxmrxk/cloudsentinel-reporter
    tag: "${image_tag}"
  env:
    TABLE_NAME: "${dynamodb_table}"
    LOG_LEVEL: "INFO"

# Redis backs the dashboard cache. Grafana and Prometheus are left to the
# cluster's existing monitoring stack. Subcharts are fetched by the
# helm_release's dependency_update.
redis:
  enabled: true
  image:
    repository: bitnamilegacy/redis
grafana:
  enabled: false
prometheus:
  enabled: false
