global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Reporter: application metrics from prometheus_client (all gunicorn
  # workers aggregated through PROMETHEUS_MULTIPROC_DIR).
  - job_name: 'cloudsentinel-reporter'
    static_configs:
      - targets: ['reporter:8000']
    metrics_path: '/metrics'

  # The auditor is not scraped: it runs as a Lambda or a short-lived CronJob
  # pod, so nothing is listening between runs. It reports each scan's
  # duration and resource count to the reporter instead, which exports them
  # as cloudsentinel_scan_duration_seconds and
  # cloudsentinel_resources_scanned_total.

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx-exporter:9113']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
