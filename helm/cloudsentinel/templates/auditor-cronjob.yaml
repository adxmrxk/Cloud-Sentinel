{{- if and .Values.auditor.enabled .Values.cronjob.enabled }}
{{- /*
The auditor is a batch job: each run scans every bucket once, POSTs the
result to the reporter, and exits.
*/}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "cloudsentinel.fullname" . }}-audit
  labels:
    {{- include "cloudsentinel.auditor.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: {{ .Values.cronjob.concurrencyPolicy }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.cronjob.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.cronjob.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ include "cloudsentinel.name" . }}-auditor
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          serviceAccountName: {{ include "cloudsentinel.serviceAccountName" . }}
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: auditor
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: "{{ .Values.auditor.image.repository }}:{{ .Values.auditor.image.tag }}"
              imagePullPolicy: {{ .Values.auditor.image.pullPolicy }}
              # Overrides the Lambda base image entrypoint; runs one scan.
              command: ["dotnet", "/var/task/Auditor.dll", "--full-scan"]
              env:
                - name: REPORTER_URL
                  value: "http://{{ include "cloudsentinel.fullname" . }}-reporter:{{ .Values.reporter.service.port }}"
                - name: AWS_REGION
                  value: {{ .Values.cloudProviders.aws.region | quote }}
                {{- with .Values.tracing.otlpEndpoint }}
                - name: OTEL_EXPORTER_OTLP_ENDPOINT
                  value: {{ . | quote }}
                {{- end }}
                {{- range $key, $value := .Values.auditor.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              envFrom:
                - secretRef:
                    name: {{ include "cloudsentinel.fullname" . }}-secrets
              resources:
                {{- toYaml .Values.auditor.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
