{{- if .Values.secrets.create }}
{{- $secretName := printf "%s-secrets" (include "cloudsentinel.fullname" .) }}
{{- /*
Postgres password: use the value if given, otherwise keep the one already in
the cluster, otherwise generate one. Regenerating on every upgrade would lock
the reporter out of an existing database.
*/}}
{{- $pgPassword := .Values.postgres.password }}
{{- if not $pgPassword }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if and $existing $existing.data (hasKey $existing.data "POSTGRES_PASSWORD") }}
{{- $pgPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
{{- else }}
{{- $pgPassword = randAlphaNum 24 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "cloudsentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- /* Omitted when empty so IRSA / instance roles are used instead. */}}
  {{- with .Values.secrets.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ . | quote }}
  {{- end }}
  SLACK_WEBHOOK_URL: {{ .Values.secrets.slackWebhookUrl | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ $pgPassword | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgres:5432/%s" .Values.postgres.user $pgPassword (include "cloudsentinel.fullname" .) .Values.postgres.database | quote }}
  {{- end }}
{{- end }}
