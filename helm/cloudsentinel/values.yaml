# CloudSentinel Helm Values

global:
  environment: production
  imageRegistry: ""
  imagePullSecrets: []

# Auditor Configuration
# Runs as the CronJob configured under `cronjob:` below, not as a Deployment.
auditor:
  enabled: true
  image:
    repository: ghcr.io/adxmrxk/cloudsentinel-auditor
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  env: {}

# Reporter Configuration
reporter:
  enabled: true
  replicaCount: 3
  image:
    repository: ghcr.io/adxmrxk/cloudsentinel-reporter
    tag: latest
    pullPolicy: Always
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  env:
    FLASK_ENV: "production"
    LOG_LEVEL: "INFO"
    TABLE_NAME: "SecurityAudits"

# Ingress Configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: cloudsentinel.example.com
      paths:
        - path: /
          pathType: Prefix
          service: reporter
  tls:
    - secretName: cloudsentinel-tls
      hosts:
        - cloudsentinel.example.com

# Redis Configuration (dashboard cache)
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: false
  # Bitnami stopped publishing these tags under docker.io/bitnami in 2025;
  # the same images remain available from bitnamilegacy.
  image:
    repository: bitnamilegacy/redis
  master:
    persistence:
      size: 1Gi

# PostgreSQL findings store (templates/postgres.yaml)
postgres:
  enabled: true
  image:
    repository: postgres
    tag: 15-alpine
  user: cloudsentinel
  database: cloudsentinel
  # Leave empty to generate one on first install and keep it on upgrades.
  password: ""
  storage: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# OpenTelemetry: OTLP/HTTP collector for traces, e.g.
# http://jaeger-collector.observability:4318. Empty disables tracing.
tracing:
  otlpEndpoint: ""

# Grafana Configuration
grafana:
  enabled: true
  adminPassword: cloudsentinel
  persistence:
    enabled: true
    size: 1Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: 'default'
          folder: 'CloudSentinel'
          type: file
          options:
            path: /var/lib/grafana/dashboards/default
  # Rendered by templates/grafana-dashboards.yaml
  dashboardsConfigMaps:
    default: cloudsentinel-grafana-dashboards
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://{{ .Release.Name }}-prometheus-server
          isDefault: true

# Prometheus Configuration
prometheus:
  enabled: true
  server:
    persistentVolume:
      size: 8Gi

# CronJob for scheduled audits
cronjob:
  enabled: true
  schedule: "0 0 * * *"  # Daily at midnight
  concurrencyPolicy: Forbid
  backoffLimit: 3
  activeDeadlineSeconds: 1800

# Cloud Provider Configuration
cloudProviders:
  aws:
    enabled: true
    region: us-east-1
  azure:
    enabled: false
    subscriptionId: ""
  gcp:
    enabled: false
    projectId: ""

# Secrets (use external secrets in production)
secrets:
  create: true
  awsAccessKeyId: ""
  awsSecretAccessKey: ""
  slackWebhookUrl: ""

# Service Account
serviceAccount:
  create: true
  name: cloudsentinel-sa
  annotations: {}

# Pod Security
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Node Selection
nodeSelector: {}
tolerations: []
affinity: {}
