#############################################
# CloudSentinel - Docker Compose
# Local Development Environment
#############################################

services:
  ###########################################
  # Auditor Service (.NET 8)
  ###########################################
  auditor:
    build:
      context: .
      dockerfile: docker/Dockerfile.auditor
    container_name: cloudsentinel-auditor
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - CLOUD_PROVIDER=aws
    ports:
      - "8081:8080"
    networks:
      - cloudsentinel-network
    depends_on:
      - dynamodb-local
      - redis
    # The auditor is a Lambda function, not an HTTP service: it exposes the
    # Runtime Interface Emulator on 8080, not a /health route. Probe the
    # listening socket instead of a URL that does not exist.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ###########################################
  # Reporter Service (Flask/Python)
  ###########################################
  reporter:
    build:
      context: .
      dockerfile: docker/Dockerfile.reporter
    container_name: cloudsentinel-reporter
    environment:
      - FLASK_ENV=development
      - TABLE_NAME=SecurityAudits
      - SECRET_NAME=CloudSentinel/Config
      - AWS_REGION=us-east-1
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - REDIS_URL=redis://redis:6379/0
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    ports:
      - "8000:8000"
    volumes:
      - ./reporter:/app:ro
    networks:
      - cloudsentinel-network
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ###########################################
  # DynamoDB Local
  ###########################################
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: cloudsentinel-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "8082:8000"
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - cloudsentinel-network
    restart: unless-stopped

  ###########################################
  # DynamoDB Table Bootstrap
  # Creates the SecurityAudits table in DynamoDB Local. The SAM template
  # only creates it in real AWS, so without this the local stack has no
  # table and every /ingest and dashboard request fails.
  ###########################################
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: cloudsentinel-dynamodb-init
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          echo 'waiting for dynamodb-local...'
          sleep 2
        done
        if aws dynamodb describe-table --table-name SecurityAudits --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; then
          echo 'SecurityAudits table already exists'
        else
          aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name SecurityAudits --attribute-definitions AttributeName=auditId,AttributeType=S AttributeName=timestamp,AttributeType=S --key-schema AttributeName=auditId,KeyType=HASH AttributeName=timestamp,KeyType=RANGE --billing-mode PAY_PER_REQUEST >/dev/null
          echo 'SecurityAudits table created'
        fi
    depends_on:
      - dynamodb-local
    networks:
      - cloudsentinel-network
    restart: "no"

  ###########################################
  # Redis Cache
  ###########################################
  redis:
    image: redis:7-alpine
    container_name: cloudsentinel-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - cloudsentinel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ###########################################
  # PostgreSQL (Alternative to DynamoDB)
  ###########################################
  postgres:
    image: postgres:15-alpine
    container_name: cloudsentinel-postgres
    environment:
      - POSTGRES_USER=cloudsentinel
      - POSTGRES_PASSWORD=cloudsentinel_secret
      - POSTGRES_DB=cloudsentinel
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudsentinel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ###########################################
  # Grafana (Monitoring Dashboard)
  ###########################################
  grafana:
    image: grafana/grafana:latest
    container_name: cloudsentinel-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=cloudsentinel
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - cloudsentinel-network
    depends_on:
      - prometheus
    restart: unless-stopped

  ###########################################
  # Prometheus (Metrics Collection)
  ###########################################
  prometheus:
    image: prom/prometheus:latest
    container_name: cloudsentinel-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cloudsentinel-network
    restart: unless-stopped

  ###########################################
  # Jaeger (Distributed Tracing)
  ###########################################
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cloudsentinel-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - cloudsentinel-network
    restart: unless-stopped

  ###########################################
  # NGINX Reverse Proxy
  ###########################################
  nginx:
    image: nginx:alpine
    container_name: cloudsentinel-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cloudsentinel-network
    depends_on:
      - reporter
      - grafana
    restart: unless-stopped

###########################################
# Networks
###########################################
networks:
  cloudsentinel-network:
    driver: bridge
    name: cloudsentinel-network

###########################################
# Volumes
###########################################
volumes:
  dynamodb-data:
  redis-data:
  postgres-data:
  grafana-data:
  prometheus-data:
