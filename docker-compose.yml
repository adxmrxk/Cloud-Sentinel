#############################################
# CloudSentinel - Docker Compose
# Local Development Environment
#############################################

# Every published host port can be overridden when it is already taken,
# e.g. GRAFANA_PORT=3300 docker compose up -d

services:
  ###########################################
  # Auditor Service (.NET 8)
  ###########################################
  auditor:
    build:
      context: .
      dockerfile: docker/Dockerfile.auditor
    container_name: cloudsentinel-auditor
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - CLOUD_PROVIDER=aws
    ports:
      - "${AUDITOR_PORT:-8081}:8080"
    networks:
      - cloudsentinel-network
    depends_on:
      - dynamodb-local
      - redis
    # The auditor is a Lambda function, not an HTTP service: it exposes the
    # Runtime Interface Emulator on 8080, not a /health route. Probe the
    # listening socket instead of a URL that does not exist.
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ###########################################
  # Auditor full scan (one-shot)
  # Runs the exact command the Kubernetes CronJob runs and sends the result
  # to the reporter. By default it scans the local S3 mock seeded with demo
  # buckets:
  #   docker compose --profile scan run --rm auditor-scan
  # To scan your real AWS account instead, export real credentials and an
  # empty AUDITOR_S3_ENDPOINT_URL:
  #   AUDITOR_S3_ENDPOINT_URL= docker compose --profile scan run --rm auditor-scan
  ###########################################
  auditor-scan:
    build:
      context: .
      dockerfile: docker/Dockerfile.auditor
    image: cloudsentinel-auditor:latest
    profiles: ["scan"]
    entrypoint: ["dotnet", "/var/task/Auditor.dll", "--full-scan"]
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - S3_ENDPOINT_URL=${AUDITOR_S3_ENDPOINT_URL-http://s3-local:5000}
      - REPORTER_URL=http://reporter:8000
      - INGEST_API_KEY=${INGEST_API_KEY:-local-dev-ingest-key}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    networks:
      - cloudsentinel-network
    depends_on:
      reporter:
        condition: service_healthy
      s3-seed:
        condition: service_completed_successfully

  ###########################################
  # Local S3 mock + demo buckets (scan profile)
  ###########################################
  s3-local:
    image: motoserver/moto:latest
    container_name: cloudsentinel-s3-local
    profiles: ["scan"]
    networks:
      - cloudsentinel-network

  s3-seed:
    image: amazon/aws-cli:latest
    profiles: ["scan"]
    environment:
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        E=http://s3-local:5000
        until aws --endpoint-url $$E s3api list-buckets >/dev/null 2>&1; do sleep 1; done
        for b in public-assets partner-exchange internal-backups; do
          aws --endpoint-url $$E s3api create-bucket --bucket $$b >/dev/null 2>&1 || true
        done
        # public-assets: no Public Access Block at all -> CRITICAL
        aws --endpoint-url $$E s3api put-public-access-block --bucket partner-exchange --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
        aws --endpoint-url $$E s3api put-public-access-block --bucket internal-backups --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
        echo 'demo buckets seeded'
    depends_on:
      - s3-local
    networks:
      - cloudsentinel-network
    restart: "no"

  ###########################################
  # Reporter Service (Flask/Python)
  ###########################################
  reporter:
    build:
      context: .
      dockerfile: docker/Dockerfile.reporter
    container_name: cloudsentinel-reporter
    environment:
      - FLASK_ENV=development
      - TABLE_NAME=SecurityAudits
      - SECRET_NAME=CloudSentinel/Config
      - AWS_REGION=us-east-1
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://cloudsentinel:cloudsentinel_secret@postgres:5432/cloudsentinel
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - OTEL_SERVICE_NAME=cloudsentinel-reporter
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      # Writers to /ingest must send this as a bearer token. Set your own
      # in .env; the default only suits a local stack.
      - INGEST_API_KEY=${INGEST_API_KEY:-local-dev-ingest-key}
    ports:
      - "${REPORTER_PORT:-8000}:8000"
    volumes:
      - ./reporter:/app:ro
    networks:
      - cloudsentinel-network
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      jaeger:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  ###########################################
  # DynamoDB Local
  ###########################################
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: cloudsentinel-dynamodb
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    ports:
      - "${DYNAMODB_PORT:-8082}:8000"
    user: root
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - cloudsentinel-network
    restart: unless-stopped

  ###########################################
  # DynamoDB Table Bootstrap
  # Creates the SecurityAudits table in DynamoDB Local. The SAM template
  # only creates it in real AWS, so without this the local stack has no
  # table and every /ingest and dashboard request fails.
  ###########################################
  dynamodb-init:
    image: amazon/aws-cli:latest
    container_name: cloudsentinel-dynamodb-init
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-local}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-local}
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws dynamodb list-tables --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; do
          echo 'waiting for dynamodb-local...'
          sleep 2
        done
        if aws dynamodb describe-table --table-name SecurityAudits --endpoint-url http://dynamodb-local:8000 >/dev/null 2>&1; then
          echo 'SecurityAudits table already exists'
          # Tables from before the dashboard index: add it in place.
          if ! aws dynamodb describe-table --table-name SecurityAudits --endpoint-url http://dynamodb-local:8000 | grep -q byTimestamp; then
            aws dynamodb update-table --endpoint-url http://dynamodb-local:8000 --table-name SecurityAudits --attribute-definitions AttributeName=recordType,AttributeType=S AttributeName=timestamp,AttributeType=S --global-secondary-index-updates '[{"Create":{"IndexName":"byTimestamp","KeySchema":[{"AttributeName":"recordType","KeyType":"HASH"},{"AttributeName":"timestamp","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}}]' >/dev/null
            echo 'byTimestamp index added'
          fi
        else
          aws dynamodb create-table --endpoint-url http://dynamodb-local:8000 --table-name SecurityAudits --attribute-definitions AttributeName=auditId,AttributeType=S AttributeName=timestamp,AttributeType=S AttributeName=recordType,AttributeType=S --key-schema AttributeName=auditId,KeyType=HASH AttributeName=timestamp,KeyType=RANGE --global-secondary-indexes '[{"IndexName":"byTimestamp","KeySchema":[{"AttributeName":"recordType","KeyType":"HASH"},{"AttributeName":"timestamp","KeyType":"RANGE"}],"Projection":{"ProjectionType":"ALL"}}]' --billing-mode PAY_PER_REQUEST >/dev/null
          echo 'SecurityAudits table created'
        fi
    depends_on:
      - dynamodb-local
    networks:
      - cloudsentinel-network
    restart: "no"

  ###########################################
  # Redis Cache
  ###########################################
  redis:
    image: redis:7-alpine
    container_name: cloudsentinel-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - cloudsentinel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ###########################################
  # PostgreSQL (Alternative to DynamoDB)
  ###########################################
  postgres:
    image: postgres:15-alpine
    container_name: cloudsentinel-postgres
    environment:
      - POSTGRES_USER=cloudsentinel
      - POSTGRES_PASSWORD=cloudsentinel_secret
      - POSTGRES_DB=cloudsentinel
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudsentinel-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudsentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ###########################################
  # Grafana (Monitoring Dashboard)
  ###########################################
  grafana:
    image: grafana/grafana:latest
    container_name: cloudsentinel-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=cloudsentinel
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - cloudsentinel-network
    depends_on:
      - prometheus
    restart: unless-stopped

  ###########################################
  # Prometheus (Metrics Collection)
  ###########################################
  prometheus:
    image: prom/prometheus:latest
    container_name: cloudsentinel-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - cloudsentinel-network
    restart: unless-stopped

  ###########################################
  # Prometheus exporters
  # Redis, NGINX and PostgreSQL do not speak Prometheus natively.
  ###########################################
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: cloudsentinel-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
    networks:
      - cloudsentinel-network
    depends_on:
      - redis
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: cloudsentinel-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:80/nginx_status
    networks:
      - cloudsentinel-network
    depends_on:
      - nginx
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: cloudsentinel-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://cloudsentinel:cloudsentinel_secret@postgres:5432/cloudsentinel?sslmode=disable
    networks:
      - cloudsentinel-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  ###########################################
  # Jaeger (Distributed Tracing)
  ###########################################
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: cloudsentinel-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - cloudsentinel-network
    restart: unless-stopped

  ###########################################
  # NGINX Reverse Proxy
  ###########################################
  nginx:
    image: nginx:alpine
    container_name: cloudsentinel-nginx
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - cloudsentinel-network
    depends_on:
      - reporter
      - grafana
    restart: unless-stopped

###########################################
# Networks
###########################################
networks:
  cloudsentinel-network:
    driver: bridge
    name: cloudsentinel-network

###########################################
# Volumes
###########################################
volumes:
  dynamodb-data:
  redis-data:
  postgres-data:
  grafana-data:
  prometheus-data:
