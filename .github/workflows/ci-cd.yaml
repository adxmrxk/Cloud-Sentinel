name: CloudSentinel CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  # GHCR image names must live under the repository owner's namespace.
  AUDITOR_IMAGE: ${{ github.repository_owner }}/cloudsentinel-auditor
  REPORTER_IMAGE: ${{ github.repository_owner }}/cloudsentinel-reporter

jobs:
  ###########################################
  # Code Quality & Security Scanning
  ###########################################
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v5

      - name: Run Checkov (IaC Security)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov-results.sarif

      - name: Run tfsec (Terraform Security)
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: terraform/

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('checkov-results.sarif') != ''
        with:
          sarif_file: checkov-results.sarif
          category: checkov

  ###########################################
  # Build & Test Auditor (.NET 8)
  ###########################################
  build-auditor:
    name: Build Auditor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test
        run: >
          dotnet test tests/Auditor.Tests/Auditor.Tests.csproj
          --configuration Release
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"

      - name: Check for vulnerable packages
        run: |
          dotnet list auditor/Auditor.csproj package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found"
            exit 1
          fi

      - name: Publish
        run: dotnet publish auditor/Auditor.csproj -c Release -r linux-x64 --self-contained false -o ./publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: auditor-build
          path: ./publish

  ###########################################
  # Build & Test Reporter (Python)
  ###########################################
  build-reporter:
    name: Build Reporter
    runs-on: ubuntu-latest
    services:
      # The findings-store tests run against a real PostgreSQL.
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cs
          POSTGRES_PASSWORD: cs
          POSTGRES_DB: cs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: reporter/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r reporter/requirements-dev.txt

      - name: Lint with flake8
        run: flake8 reporter/ --count --show-source --statistics

      - name: Format check with Black
        run: black --check reporter/

      - name: Test with pytest
        env:
          TEST_DATABASE_URL: postgresql://cs:cs@localhost:5432/cs
        run: >
          pytest reporter/ -rs
          --cov=reporter --cov-report=xml --cov-report=term
          --cov-fail-under=85

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          # Reporting only; the coverage gate is --cov-fail-under above.
          fail_ci_if_error: false

  ###########################################
  # Kubernetes end-to-end (kind)
  # Deploys k8s/overlays/local - the real base manifests plus local
  # stand-ins for DynamoDB and S3 - triggers the audit CronJob, and checks
  # the reporter received and indexed the findings.
  ###########################################
  k8s-e2e:
    name: Kubernetes E2E
    runs-on: ubuntu-latest
    needs: [build-auditor, build-reporter]
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: |
          docker build -f docker/Dockerfile.reporter -t cloudsentinel-reporter:local .
          docker build -f docker/Dockerfile.auditor -t cloudsentinel-auditor:local .

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: cloudsentinel

      - name: Load images
        run: kind load docker-image cloudsentinel-reporter:local cloudsentinel-auditor:local --name cloudsentinel

      - name: Deploy
        run: |
          kubectl apply -k k8s/overlays/local
          kubectl -n cloudsentinel wait --for=condition=complete job/local-aws-seed --timeout=300s
          kubectl -n cloudsentinel rollout status deploy/reporter --timeout=300s
          kubectl -n cloudsentinel rollout status statefulset/postgres --timeout=300s

      - name: Run the audit CronJob
        run: |
          kubectl -n cloudsentinel create job audit-e2e --from=cronjob/cloudsentinel-audit
          kubectl -n cloudsentinel wait --for=condition=complete job/audit-e2e --timeout=300s
          kubectl -n cloudsentinel logs job/audit-e2e

      - name: Verify findings reached the reporter
        run: |
          kubectl -n cloudsentinel exec deploy/reporter -- python -c "
          import json, urllib.request
          s = json.load(urllib.request.urlopen('http://localhost:8000/api/findings/summary'))
          print(s)
          assert s['bySeverity']['CRITICAL'] == 1, s
          assert s['bySeverity']['HIGH'] == 1, s
          assert {r['resourceName'] for r in s['topResources']} == {'public-assets', 'partner-exchange'}, s
          html = urllib.request.urlopen('http://localhost:8000/').read().decode()
          assert 'public-assets' in html
          metrics = urllib.request.urlopen('http://localhost:8000/metrics').read().decode()
          assert 'cloudsentinel_findings_by_severity{provider=\"aws\",severity=\"CRITICAL\"} 1.0' in metrics
          print('E2E OK')
          "

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n cloudsentinel get all
          kubectl -n cloudsentinel describe pods
          kubectl -n cloudsentinel logs deploy/reporter --tail=200 || true

  ###########################################
  # Helm chart
  ###########################################
  helm-chart:
    name: Helm Chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Resolve dependencies
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build ./helm/cloudsentinel

      - name: Lint and render
        run: |
          helm lint ./helm/cloudsentinel
          helm template cloudsentinel ./helm/cloudsentinel > rendered.yaml
          grep -q "kind: CronJob" rendered.yaml

  ###########################################
  # Build Docker Images
  ###########################################
  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [build-auditor, build-reporter]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (Auditor)
        id: meta-auditor
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.AUDITOR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Auditor
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.auditor
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-auditor.outputs.tags }}
          labels: ${{ steps.meta-auditor.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata (Reporter)
        id: meta-reporter
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPORTER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Reporter
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.reporter
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-reporter.outputs.tags }}
          labels: ${{ steps.meta-reporter.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ###########################################
  # Container Security Scanning
  ###########################################
  security-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read
    env:
      # New GHCR packages are private by default, even for public repositories.
      TRIVY_USERNAME: ${{ github.actor }}
      TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner (Auditor)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.AUDITOR_IMAGE }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-auditor.sarif'

      - name: Run Trivy vulnerability scanner (Reporter)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.REPORTER_IMAGE }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-reporter.sarif'

      - name: Upload Trivy results (Auditor)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-auditor.sarif'
          category: trivy-auditor

      - name: Upload Trivy results (Reporter)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-reporter.sarif'
          category: trivy-reporter

  ###########################################
  # Deploy to Kubernetes
  # Skipped with a notice until the KUBECONFIG secret is configured.
  ###########################################
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-docker, security-scan, k8s-e2e, helm-chart]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    env:
      HAS_KUBECONFIG: ${{ secrets.KUBECONFIG != '' }}
    steps:
      - name: Deployment not configured
        if: env.HAS_KUBECONFIG != 'true'
        run: echo "::notice::KUBECONFIG secret is not set; skipping deployment."

      - uses: actions/checkout@v5
        if: env.HAS_KUBECONFIG == 'true'

      - name: Setup Helm
        if: env.HAS_KUBECONFIG == 'true'
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Configure kubectl
        if: env.HAS_KUBECONFIG == 'true'
        uses: azure/k8s-set-context@v3
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      # Subcharts are declared in Chart.yaml and pinned in Chart.lock, but the
      # archives are not committed, so they must be fetched before install.
      # `helm dependency build` resolves from the lock file, which requires the
      # source repositories to be registered first.
      - name: Resolve Helm dependencies
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm dependency build ./helm/cloudsentinel

      - name: Deploy with Helm
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          helm upgrade --install cloudsentinel ./helm/cloudsentinel \
            --namespace cloudsentinel \
            --create-namespace \
            --set auditor.image.tag=${{ github.sha }} \
            --set reporter.image.tag=${{ github.sha }} \
            --set secrets.awsAccessKeyId=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --set secrets.awsSecretAccessKey=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --wait --timeout 5m

      - name: Verify deployment
        if: env.HAS_KUBECONFIG == 'true'
        run: |
          kubectl rollout status deployment/cloudsentinel-reporter -n cloudsentinel
          kubectl get cronjob/cloudsentinel-audit -n cloudsentinel

  ###########################################
  # Terraform
  # validate/fmt always run; plan/apply need AWS credentials and the S3
  # state backend, and are skipped with a notice until they are configured.
  ###########################################
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    needs: [code-quality]
    defaults:
      run:
        working-directory: terraform
    env:
      HAS_AWS_CREDENTIALS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Remote state not configured
        if: env.HAS_AWS_CREDENTIALS != 'true'
        run: echo "::notice::AWS credentials are not set; skipping terraform plan/apply."

      - name: Terraform Init (remote state)
        if: env.HAS_AWS_CREDENTIALS == 'true'
        run: terraform init -input=false -reconfigure
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        if: env.HAS_AWS_CREDENTIALS == 'true'
        run: terraform plan -input=false -out=tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Terraform Apply
        if: env.HAS_AWS_CREDENTIALS == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -input=false -auto-approve tfplan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
