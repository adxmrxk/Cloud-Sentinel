apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudsentinel-config
  namespace: cloudsentinel
  labels:
    app.kubernetes.io/name: cloudsentinel
data:
  AWS_REGION: "us-east-1"
  # Read by the reporter (it was previously set as DYNAMODB_TABLE, which
  # nothing reads).
  TABLE_NAME: "SecurityAudits"
  LOG_LEVEL: "INFO"
  FLASK_ENV: "production"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  # Tracing is off unless an OTLP/HTTP collector is configured, e.g.
  # "http://jaeger-collector.observability:4318".
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
