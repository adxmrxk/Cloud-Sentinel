apiVersion: v1
kind: Secret
metadata:
  name: cloudsentinel-secrets
  namespace: cloudsentinel
  labels:
    app.kubernetes.io/name: cloudsentinel
type: Opaque
stringData:
  # Prefer IRSA (see serviceaccount.yaml) over static keys on EKS; delete
  # these two entries when using it.
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_YOUR_KEY"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_YOUR_SECRET"
  SLACK_WEBHOOK_URL: ""
  # Keep these two passwords in sync.
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql://cloudsentinel:change-me@postgres-service:5432/cloudsentinel"
