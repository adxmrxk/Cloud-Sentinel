# The auditor is a batch job, not a service: each run scans every bucket
# once, POSTs the result to the reporter, and exits. It used to also be
# deployed as a long-running Deployment, which only sat idle.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudsentinel-audit
  namespace: cloudsentinel
  labels:
    app.kubernetes.io/name: auditor
    app.kubernetes.io/component: scheduler
spec:
  schedule: "0 0 * * *"  # Daily at midnight UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 1800  # 30 minutes max
      template:
        metadata:
          labels:
            app.kubernetes.io/name: auditor
            app.kubernetes.io/component: audit-job
        spec:
          serviceAccountName: cloudsentinel-sa
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: auditor
              image: ghcr.io/adxmrxk/cloudsentinel-auditor:latest
              imagePullPolicy: Always
              # Overrides the Lambda base image entrypoint; runs one scan.
              command: ["dotnet", "/var/task/Auditor.dll", "--full-scan"]
              env:
                - name: REPORTER_URL
                  value: "http://reporter-service:8000"
              envFrom:
                - configMapRef:
                    name: cloudsentinel-config
                - secretRef:
                    name: cloudsentinel-secrets
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
