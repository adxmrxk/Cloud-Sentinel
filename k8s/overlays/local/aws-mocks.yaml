apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dynamodb-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dynamodb-local
    spec:
      containers:
        - name: dynamodb-local
          image: amazon/dynamodb-local:latest
          args: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
          ports:
            - containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
spec:
  selector:
    app.kubernetes.io/name: dynamodb-local
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-local
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s3-local
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3-local
    spec:
      containers:
        - name: moto
          image: motoserver/moto:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: s3-local
spec:
  selector:
    app.kubernetes.io/name: s3-local
  ports:
    - port: 5000
      targetPort: 5000
---
# Creates the DynamoDB table and three demo buckets:
#   public-assets     no Public Access Block        -> CRITICAL
#   partner-exchange  3 of 4 protections disabled   -> HIGH
#   internal-backups  fully blocked                 -> not reported
apiVersion: batch/v1
kind: Job
metadata:
  name: local-aws-seed
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: amazon/aws-cli:latest
          env:
            - name: AWS_ACCESS_KEY_ID
              value: local
            - name: AWS_SECRET_ACCESS_KEY
              value: local
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              D=http://dynamodb-local:8000
              S=http://s3-local:5000
              until aws dynamodb list-tables --endpoint-url $D >/dev/null 2>&1; do sleep 2; done
              until aws s3api list-buckets --endpoint-url $S >/dev/null 2>&1; do sleep 2; done
              aws dynamodb describe-table --table-name SecurityAudits --endpoint-url $D >/dev/null 2>&1 || \
                aws dynamodb create-table --endpoint-url $D --table-name SecurityAudits \
                  --attribute-definitions AttributeName=auditId,AttributeType=S AttributeName=timestamp,AttributeType=S \
                  --key-schema AttributeName=auditId,KeyType=HASH AttributeName=timestamp,KeyType=RANGE \
                  --billing-mode PAY_PER_REQUEST >/dev/null
              for b in public-assets partner-exchange internal-backups; do
                aws s3api create-bucket --bucket $b --endpoint-url $S >/dev/null 2>&1 || true
              done
              aws s3api put-public-access-block --endpoint-url $S --bucket partner-exchange \
                --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=false,BlockPublicPolicy=false,RestrictPublicBuckets=false
              aws s3api put-public-access-block --endpoint-url $S --bucket internal-backups \
                --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
              echo seeded
